# Example Nginx Server Block for Enterprise Banking Deployment
# Place in /etc/nginx/conf.d/lineage.conf

server {
    listen 80;
    server_name lineage.internal.bank; # Change to internal domain or IP

    # Serve compiled static frontend assets
    location / {
        root /opt/lineage_ui.service/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API calls to internal backend service
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
